name: Windows release

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: sayforge-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    outputs:
      release_needed: ${{ steps.preflight.outputs.release_needed }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Release guard regression tests
        run: ./.github/scripts/test-release.ps1

      - name: Validate versions and skip existing tags
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/release.ps1 -Stage Preflight

      - name: Require updater signing secrets
        if: steps.preflight.outputs.release_needed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Updater signing private key secret is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Updater signing password secret is missing.' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          workspaces: client/src-tauri -> target
          cache-on-failure: false

      - name: Install frontend dependencies
        if: steps.preflight.outputs.release_needed == 'true'
        working-directory: client
        run: npm ci

      - name: Frontend tests and English UI verification
        if: steps.preflight.outputs.release_needed == 'true'
        working-directory: client
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          npm run i18n:check
          if ($LASTEXITCODE -ne 0) { throw 'English UI verification failed.' }

      - name: Rust tests
        if: steps.preflight.outputs.release_needed == 'true'
        working-directory: client/src-tauri
        run: cargo test --locked --target x86_64-pc-windows-msvc

      # beforeBuildCommand runs tsc + Vite once. No release is created by this action.
      - name: Build NSIS installer
        id: tauri
        if: steps.preflight.outputs.release_needed == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify installer and prepare checksums and notices
        if: steps.preflight.outputs.release_needed == 'true'
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TAURI_APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: ./.github/scripts/release.ps1 -Stage Prepare

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.release_needed == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish public release for the tested commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/release.ps1 -Stage Publish
