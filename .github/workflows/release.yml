name: Windows release

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: sayforge-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.version.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Release version regression tests
        shell: pwsh
        run: ./.github/scripts/test-release-version.ps1
      - name: Prepare or reuse the release version commit
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-release.ps1

  build:
    needs: prepare
    env:
      RELEASE_COMMIT_SHA: ${{ needs.prepare.outputs.release_commit }}
      CARGO_INCREMENTAL: '0'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    outputs:
      release_needed: ${{ steps.preflight.outputs.release_needed }}
      version: ${{ steps.preflight.outputs.version }}
      release_commit: ${{ needs.prepare.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          persist-credentials: false

      - name: Validate versions and skip existing tags
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/release.ps1 -Stage Preflight

      - name: Require updater signing secrets
        if: steps.preflight.outputs.release_needed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Updater signing private key secret is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Updater signing password secret is missing.' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Identify Rust dependency cache
        id: rust-cache-key
        if: steps.preflight.outputs.release_needed == 'true'
        run: |
          ./.github/scripts/test-rust-cache-key.ps1
          ./.github/scripts/rust-cache-key.ps1
      - name: Restore complete Rust dependency cache
        id: rust-cache
        if: steps.preflight.outputs.release_needed == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust-cache-key.outputs.paths }}
          key: ${{ steps.rust-cache-key.outputs.key }}
          restore-keys: ${{ steps.rust-cache-key.outputs.restore-prefix }}
      - name: Restore dependencies from an interrupted build
        id: rust-partial-cache
        if: steps.preflight.outputs.release_needed == 'true' && steps.rust-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust-cache-key.outputs.paths }}
          key: ${{ steps.rust-cache-key.outputs.partial-key }}
          restore-keys: ${{ steps.rust-cache-key.outputs.partial-prefix }}

      - name: Build and test updater signature verifier
        id: verifier
        if: steps.preflight.outputs.release_needed == 'true'
        run: |
          cargo test --locked --manifest-path .github/tools/updater-verifier/Cargo.toml --target x86_64-pc-windows-msvc --timings
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verifier tests failed.' }
          cargo build --release --locked --manifest-path .github/tools/updater-verifier/Cargo.toml --target x86_64-pc-windows-msvc --timings
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verifier build failed.' }

      - name: Release guard regression tests
        if: steps.preflight.outputs.release_needed == 'true'
        env:
          SAYFORGE_UPDATER_VERIFIER: ${{ github.workspace }}\.github\tools\updater-verifier\target\x86_64-pc-windows-msvc\release\sayforge-updater-verifier.exe
        run: ./.github/scripts/test-release.ps1

      - name: Install frontend dependencies
        if: steps.preflight.outputs.release_needed == 'true'
        working-directory: client
        run: npm ci

      - name: Frontend lint, tests and English UI verification
        if: steps.preflight.outputs.release_needed == 'true'
        working-directory: client
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          npm run i18n:check
          if ($LASTEXITCODE -ne 0) { throw 'English UI verification failed.' }

      - name: Rust tests
        if: steps.preflight.outputs.release_needed == 'true'
        working-directory: client/src-tauri
        run: cargo test --locked --target x86_64-pc-windows-msvc --timings

      # beforeBuildCommand runs tsc + Vite once. No release is created by this action.
      - name: Build NSIS installer
        id: tauri
        if: steps.preflight.outputs.release_needed == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked --timings
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify installer and prepare checksums and notices
        if: steps.preflight.outputs.release_needed == 'true'
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TAURI_APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
          SAYFORGE_UPDATER_VERIFIER: ${{ github.workspace }}\.github\tools\updater-verifier\target\x86_64-pc-windows-msvc\release\sayforge-updater-verifier.exe
        run: ./.github/scripts/release.ps1 -Stage Prepare

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preflight.outputs.release_needed == 'true'
        with:
          name: updater-verifier
          path: .github/tools/updater-verifier/target/x86_64-pc-windows-msvc/release/sayforge-updater-verifier.exe
          if-no-files-found: error
          retention-days: 14

      - name: Save complete Rust dependency cache
        if: success() && steps.rust-cache.outputs.cache-hit != 'true' && steps.preflight.outputs.release_needed == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust-cache-key.outputs.paths }}
          key: ${{ steps.rust-cache-key.outputs.key }}
      - name: Save dependencies after a failed build or test
        if: failure() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' && (steps.verifier.outcome == 'success' || steps.verifier.outcome == 'failure')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust-cache-key.outputs.paths }}
          key: ${{ steps.rust-cache-key.outputs.partial-key }}
      - name: Record cache and build metrics
        if: always() && steps.preflight.outputs.release_needed == 'true'
        env:
          COMPLETE_CACHE: ${{ steps.rust-cache.outputs.cache-matched-key }}
          PARTIAL_CACHE: ${{ steps.rust-partial-cache.outputs.cache-matched-key }}
        run: |
          New-Item -ItemType Directory -Path target/ci-metrics -Force | Out-Null
          @{
            sha = (git rev-parse HEAD)
            compiler = (rustc -V)
            completeCache = $env:COMPLETE_CACHE
            partialCache = $env:PARTIAL_CACHE
          } | ConvertTo-Json | Set-Content target/ci-metrics/build.json
          "Complete cache: $env:COMPLETE_CACHE; partial cache: $env:PARTIAL_CACHE" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Cargo timings and build metrics
        if: always() && steps.preflight.outputs.release_needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cargo-timings-${{ github.run_attempt }}
          path: |
            client/src-tauri/target/cargo-timings/*.html
            .github/tools/updater-verifier/target/cargo-timings/*.html
            target/ci-metrics/*
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.release_needed == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      RELEASE_COMMIT_SHA: ${{ needs.build.outputs.release_commit }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.release_commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater-verifier
          path: updater-verifier

      - name: Publish public release for the tested commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SAYFORGE_UPDATER_VERIFIER: ${{ github.workspace }}\updater-verifier\sayforge-updater-verifier.exe
        run: ./.github/scripts/release.ps1 -Stage Publish
